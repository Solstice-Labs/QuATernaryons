[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quaternaryons"
version = "0.2.0"
description = "Dual-Sided Sub-2-Bit Weight and Dynamic KV-Cache Quantization via 4D Isoclinic Clifford Rotors"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Shreyan D. Gondaliya", email = "shreyan@solstice-ai.co" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "transformers>=4.38.0",
    "accelerate>=0.27.0"
]

[project.urls]
Homepage = "https://solstice-ai.co/foundry"
Repository = "https://github.com/Solstice-Labs/QuATernaryons"
DOI = "https://doi.org/10.5281/zenodo.23530592"
